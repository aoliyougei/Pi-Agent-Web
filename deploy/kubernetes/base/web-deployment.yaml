apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent-web
  labels:
    app.kubernetes.io/name: pi-agent-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-agent-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-agent-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.aoliyougei.com/aoliyougei/pi-agent-web:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PI_AGENT_RPC_URL
              value: http://pi-agent-rpc:8080
            - name: PI_AGENT_RPC_TOKEN_FILE
              value: /run/secrets/pi-agent-rpc-token
            - name: PI_WEB_CONFIG_DIR
              value: /var/lib/pi-agent-web/backends
          ports:
            - name: http
              containerPort: 30141
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
          volumeMounts:
            - name: web-config
              mountPath: /var/lib/pi-agent-web
            - name: rpc-token
              mountPath: /run/secrets/pi-agent-rpc-token
              subPath: pi-agent-rpc-token
              readOnly: true
      volumes:
        - name: web-config
          persistentVolumeClaim:
            claimName: pi-agent-web-config
        - name: rpc-token
          secret:
            secretName: pi-agent-rpc-token
            optional: false
            defaultMode: 288
