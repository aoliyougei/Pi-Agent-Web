apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent-rpc
  labels:
    app.kubernetes.io/name: pi-agent-rpc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-agent-rpc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-agent-rpc
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: pi-agent-rpc:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PI_AGENT_RPC_TOKEN_FILE
              value: /run/secrets/pi-agent-rpc-token
          ports:
            - name: rpc
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /internal/v1/health/live
              port: rpc
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - 'const fs=require("node:fs");const token=fs.readFileSync("/run/secrets/pi-agent-rpc-token","utf8").replace(/\r?\n$/,"");fetch("http://127.0.0.1:8080/internal/v1/health/ready",{headers:{authorization:`Bearer ${token}`}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
          volumeMounts:
            - name: rpc-token
              mountPath: /run/secrets/pi-agent-rpc-token
              subPath: pi-agent-rpc-token
              readOnly: true
            - name: workspace
              mountPath: /app
            - name: pi-data
              mountPath: /home/node/.pi
      volumes:
        - name: rpc-token
          secret:
            secretName: pi-agent-rpc-token
            optional: false
            defaultMode: 288
        - name: workspace
          persistentVolumeClaim:
            claimName: pi-agent-workspace
        - name: pi-data
          persistentVolumeClaim:
            claimName: pi-agent-data
